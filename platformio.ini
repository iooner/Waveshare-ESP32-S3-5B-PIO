; Waveshare ESP32-S3-LCD-5B (sans tactile)
; ESP32-S3-WROOM-1-N16R8 (16MB flash QIO, 8MB PSRAM octal), LCD RGB 1024x600, CH422G

[platformio]
default_envs = waveshare-5b

[env:waveshare-5b]
; pioarduino = Arduino core 3.x (ESP-IDF 5.x), requis pour l'API esp_lcd utilisée par src/lcd.cpp
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; -O2 au lieu de -Os : les boucles de dessin sont nettement plus rapides
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    ; 0 = Serial sur le port USB "UART" (CH343), 1 = Serial sur le port USB natif (GPIO19/20)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Aucune bibliothèque externe : tout passe par le core Arduino et l'ESP-IDF qu'il embarque
